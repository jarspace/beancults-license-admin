<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beancults POS — Admin</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111713;
      color: #f4f5ed;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      background: #1c241e;
      border: 1px solid #354338;
      border-radius: 18px;
    }

    .brand {
      color: #c4d6a0;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 27px;
    }

    .subtitle {
      color: #a6b0a6;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 13px;
      color: #dce3d7;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #455448;
      border-radius: 9px;
      background: #111713;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus { border-color: #b4cd8c; }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #c4d6a0;
      color: #172016;
      font-size: 15px;
      font-weight: bold;
    }

    .status {
      margin-top: 18px;
      text-align: center;
      color: #a6b0a6;
      font-size: 13px;
    }

    footer {
      margin-top: 26px;
      text-align: center;
      color: #7f8a80;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">BEANCULTS</div>
    <h1>Admin Panel</h1>
    <div class="subtitle">
      Manajemen lisensi dan perangkat POS toko Anda.
    </div>

    <form id="loginForm">
      <label for="email">Email administrator</label>
      <input
        id="email"
        type="email"
        placeholder="admin@email.com"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Masuk</button>
    </form>

    <div class="status" id="status">
      Portal administrator
    </div>

    <footer>BEANCULTS POS · LICENSE MANAGEMENT</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://flfcrnuzaijydcahctnj.supabase.co";
const SUPABASE_KEY = "sb_publishable_64s9cIol8IpQfV-_s-wL9g_rrucHS-v";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const statusEl = document.getElementById("status");
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  statusEl.textContent = "Memeriksa login...";
  loginForm.querySelector("button").disabled = true;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    const { data: result, error: functionError } =
      await supabaseClient.functions.invoke("license-admin", {
        body: { action: "ping" }
      });

    if (functionError) throw functionError;

    if (!result || !result.ok) {
      throw new Error(result?.error || "Verifikasi administrator gagal.");
    }

    statusEl.textContent = "Login admin berhasil!";
    alert("Login berhasil. Akun administrator terverifikasi.");

  } catch (error) {
    await supabaseClient.auth.signOut();
    statusEl.textContent = "Login gagal: " + error.message;
  } finally {
    loginForm.querySelector("button").disabled = false;
  }
});
</script>
</body>
</html>
